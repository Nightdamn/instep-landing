# site.instep.expert: статический лендинг InStep (dist/ из vite build).
# Ставится как /etc/nginx/sites-available/site.instep.expert + symlink в sites-enabled.
# HTTPS-блок и редирект добавляет certbot: certbot --nginx -d site.instep.expert

server {
    listen 80;
    listen [::]:80;
    server_name site.instep.expert;

    root /opt/instep-landing/dist;
    index index.html;

    access_log /var/log/nginx/site.instep.expert.access.log;
    error_log  /var/log/nginx/site.instep.expert.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Хэшированные бандлы Vite: кэш на год.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Нехэшированная статика (иконки, favicon): сутки.
    location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Одна страница; якоря обрабатываются на клиенте.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
